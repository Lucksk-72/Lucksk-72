name: Publicar EFIeEJA no GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "EFIeEJA/**"
      - ".github/workflows/deploy-efieeja.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Preparar somente o EFIeEJA
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./EFIeEJA
      - name: Publicar aplicativo
        id: deployment
        uses: actions/deploy-pages@v4
